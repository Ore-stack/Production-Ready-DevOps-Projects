name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main
  paths:
    include:
      - 'Project 2 - CI-CD Pipeline/*'

parameters:
  - name: deployProduction
    displayName: Also deploy to Production (after Staging succeeds)
    type: boolean
    default: false
  - name: enableCodeQL
    displayName: Run CodeQL (requires GitHub Advanced Security for Azure DevOps)
    type: boolean
    default: false

variables:
  - group: aws-ecs-shared
  - name: CONTAINER_NAME
    value: webapp
  - name: CONTAINER_PORT
    value: '3001'
  - name: PROJECT_DIR
    value: 'Project 2 - CI-CD Pipeline'
  - name: TRIVY_SEVERITY
    value: 'CRITICAL,HIGH'
  - name: npm_config_cache
    value: $(Pipeline.Workspace)/.npm

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: postgres
      image: postgres:15-alpine
      ports:
        - 5432:5432
      env:
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
        POSTGRES_DB: test_database
      options: >-
        --health-cmd pg_isready
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

stages:
  # ======================= Test =======================
  - stage: Test
    displayName: '🧪 Test Application'
    jobs:
      - job: Test
        displayName: 'Test Application'
        timeoutInMinutes: 10
        services:
          postgres: postgres
        steps:
          - checkout: self
            fetchDepth: 0

          - task: NodeTool@0
            displayName: '⚙️ Setup Node.js'
            inputs:
              versionSpec: '18.x'

          - task: Cache@2
            displayName: 'Cache npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | "$(PROJECT_DIR)/package-lock.json"'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)

          - script: |
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            displayName: '🐘 Install PostgreSQL client'

          - script: npm ci --audit false
            displayName: '📦 Install dependencies'
            workingDirectory: $(PROJECT_DIR)

          - script: |
              until pg_isready -h localhost -p 5432 -U test_user; do
                echo "Waiting for postgres..."
                sleep 2
              done
              echo "✅ Database is ready!"
            displayName: '🗃️ Wait for database'

          - script: |
              psql -h localhost -p 5432 -U test_user -d test_database -c "
                CREATE TABLE IF NOT EXISTS app_status (
                  id SERIAL PRIMARY KEY,
                  status VARCHAR(50) NOT NULL,
                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                );
                INSERT INTO app_status (status) VALUES ('initialized');
              "
            displayName: '🛠️ Initialize database'
            env:
              PGPASSWORD: test_password

          - script: npm run lint --if-present || echo "Linting not configured"
            displayName: '🔍 Run linting'
            workingDirectory: $(PROJECT_DIR)

          - script: npm test -- --passWithNoTests
            displayName: '✅ Run tests'
            workingDirectory: $(PROJECT_DIR)
            env:
              NODE_ENV: test
              DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_database

          - script: docker build -t test-build .
            displayName: '🐳 Test Docker build'
            workingDirectory: $(PROJECT_DIR)

      - ${{ if eq(parameters.enableCodeQL, true) }}:
          - job: CodeQL
            displayName: 'CodeQL Analysis'
            steps:
              - checkout: self
              - task: AdvancedSecurity-Codeql-Init@1
                inputs:
                  languages: javascript
              - task: NodeTool@0
                inputs:
                  versionSpec: '18.x'
              - script: npm ci --audit false
                displayName: '📦 Install dependencies'
                workingDirectory: $(PROJECT_DIR)
              - task: AdvancedSecurity-Codeql-Analyze@1
                displayName: '🔎 Perform CodeQL Analysis'

  # ================== Security scan ===================
  - stage: SecurityScan
    displayName: '🔒 Security Scanning'
    dependsOn: Test
    jobs:
      - job: Trivy
        displayName: 'Trivy image scan'
        steps:
          - checkout: self

          - script: docker build -t my-webapp:latest .
            displayName: '🐳 Build Docker image'
            workingDirectory: $(PROJECT_DIR)

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sudo sh -s -- -b /usr/local/bin
            displayName: '🔧 Install Trivy'

          - script: |
              trivy image \
                --format sarif --output $(Build.ArtifactStagingDirectory)/trivy-results.sarif \
                --severity "$(TRIVY_SEVERITY)" --exit-code 0 \
                --ignore-unfixed --vuln-type os,library \
                my-webapp:latest
            displayName: '🔍 Run Trivy (generate SARIF, never fails)'

          - task: PublishPipelineArtifact@1
            displayName: '📊 Publish Trivy results'
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/trivy-results.sarif
              artifact: trivy-scan-results

          - script: |
              trivy image --severity "$(TRIVY_SEVERITY)" --exit-code 1 \
                --ignore-unfixed --vuln-type os,library --quiet my-webapp:latest
            displayName: '❌ Fail if CRITICAL/HIGH vulnerabilities found'

  # ============ Build once, scan, push to ECR ============
  - stage: BuildPush
    displayName: '📦 Build and Push Image'
    dependsOn:
      - Test
      - SecurityScan
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: BuildPush
        displayName: 'Build, scan and push'
        timeoutInMinutes: 20
        steps:
          - checkout: self

          - task: AWSShellScript@1
            displayName: '🔐 Login to Amazon ECR'
            inputs:
              awsCredentials: aws-nonprod
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                REGISTRY="${ACCOUNT_ID}.dkr.ecr.$(AWS_REGION).amazonaws.com"
                aws ecr get-login-password --region $(AWS_REGION) \
                  | docker login --username AWS --password-stdin "$REGISTRY"
                echo "##vso[task.setvariable variable=ECR_REGISTRY]$REGISTRY"

          - script: |
              IMAGE_TAG=$(Build.SourceVersion)
              docker build \
                --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --label "org.opencontainers.image.source=$(Build.Repository.Uri)" \
                -t $(ECR_REGISTRY)/$(ECR_REPOSITORY):$IMAGE_TAG \
                -t $(ECR_REGISTRY)/$(ECR_REPOSITORY):latest \
                .
              echo "##vso[task.setvariable variable=IMAGE_URI]$(ECR_REGISTRY)/$(ECR_REPOSITORY):$IMAGE_TAG"
            displayName: '🐳 Build Docker image'
            workingDirectory: $(PROJECT_DIR)

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sudo sh -s -- -b /usr/local/bin
              trivy image --format table --severity "$(TRIVY_SEVERITY)" --exit-code 1 \
                --ignore-unfixed --vuln-type os,library "$(IMAGE_URI)"
            displayName: '🔍 Scan production image with Trivy'

          - task: AWSShellScript@1
            displayName: '📤 Push image to ECR'
            inputs:
              awsCredentials: aws-nonprod
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                docker push $(ECR_REGISTRY)/$(ECR_REPOSITORY):$(Build.SourceVersion)
                docker push $(ECR_REGISTRY)/$(ECR_REPOSITORY):latest
                echo "✅ Images pushed to ECR"

  # ================= Deploy: Test =================
  - template: templates/deploy-stage.yml
    parameters:
      stageName: DeployTest
      displayName: '🚀 Deploy to Test'
      environment: test
      dependsOn:
        - BuildPush
      variableGroup: aws-ecs-test
      awsServiceConnection: aws-nonprod

  # ================= Deploy: Staging =================
  - template: templates/deploy-stage.yml
    parameters:
      stageName: DeployStaging
      displayName: '🚀 Deploy to Staging'
      environment: staging
      dependsOn:
        - DeployTest
      variableGroup: aws-ecs-staging
      awsServiceConnection: aws-nonprod

  # ================= Deploy: Production (off by default) =================
  - ${{ if eq(parameters.deployProduction, true) }}:
      - template: templates/deploy-stage.yml
        parameters:
          stageName: DeployProduction
          displayName: '🚀 Deploy to Production'
          environment: production
          dependsOn:
            - DeployStaging
          variableGroup: aws-ecs-prod
          awsServiceConnection: aws-prod

  # ============ Cleanup if the image push fails ============
  - stage: Cleanup
    displayName: '🧹 Cleanup (on failure)'
    dependsOn: BuildPush
    condition: and(always(), eq(dependencies.BuildPush.result, 'Failed'))
    jobs:
      - job: Cleanup
        displayName: 'Remove partially pushed image'
        steps:
          - checkout: none
          - task: AWSShellScript@1
            displayName: '🗑️ Delete image tagged with this commit'
            inputs:
              awsCredentials: aws-nonprod
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                aws ecr batch-delete-image --repository-name "$(ECR_REPOSITORY)" \
                  --image-ids imageTag=$(Build.SourceVersion) \
                  || echo "Nothing to delete"

  # ================= Email notification =================
  - stage: Notify
    displayName: '📧 Send Email Notification'
    dependsOn:
      - Test
      - SecurityScan
      - BuildPush
      - DeployTest
      - DeployStaging
      - ${{ if eq(parameters.deployProduction, true) }}:
          - DeployProduction
      - Cleanup
    condition: always()
    variables:
      - name: testResult
        value: $[ stageDependencies.Test.Test.result ]
      - name: scanResult
        value: $[ stageDependencies.SecurityScan.Trivy.result ]
      - name: buildResult
        value: $[ stageDependencies.BuildPush.BuildPush.result ]
      - name: deployTestResult
        value: $[ stageDependencies.DeployTest.Deploy.result ]
      - name: deployStagingResult
        value: $[ stageDependencies.DeployStaging.Deploy.result ]
      - ${{ if eq(parameters.deployProduction, true) }}:
          - name: deployProdResult
            value: $[ stageDependencies.DeployProduction.Deploy.result ]
      - ${{ if ne(parameters.deployProduction, true) }}:
          - name: deployProdResult
            value: 'not requested'
    jobs:
      - job: Notify
        displayName: 'Send email'
        steps:
          - checkout: none
          - script: |
              cat > mail.txt <<EOF
              From: Azure Pipelines <$(SMTP_USERNAME)>
              To: $(NOTIFICATION_EMAIL)
              Subject: Azure Pipelines: $(Build.DefinitionName) ($(Build.Repository.Name))

              Repository:   $(Build.Repository.Name)
              Triggered by: $(Build.RequestedFor)
              Commit:       $(Build.SourceVersion)

              Stage results:
              - Test:           $(testResult)
              - Security scan:  $(scanResult)
              - Build + push:   $(buildResult)
              - Deploy Test:    $(deployTestResult)
              - Deploy Staging: $(deployStagingResult)
              - Production:     $(deployProdResult)

              View details: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
              EOF

              curl --ssl-reqd --url "smtp://smtp.gmail.com:587" \
                --user "$(SMTP_USERNAME):$(SMTP_PASSWORD)" \
                --mail-from "$(SMTP_USERNAME)" \
                --mail-rcpt "$(NOTIFICATION_EMAIL)" \
                --upload-file mail.txt
            displayName: '📧 Send email notification'
